# Rotates the Django log files. Runs from the user crontab on the server
# (no root needed); copytruncate because the gunicorn workers keep the
# files open:
#   15 0 * * * /usr/sbin/logrotate -s /home/johannes/.logrotate-danbw.state /home/johannes/websites/danbw/deploy/logrotate.conf

/home/johannes/websites/danbw/django.log
/home/johannes/websites/danbw/disallowed_hosts.log {
    # Monthly, or earlier at 5 MB; keeps at most 3 months of old entries
    monthly
    maxsize 5M
    rotate 3
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
